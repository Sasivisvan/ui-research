<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Mirrors the reset that the artifact publish skeleton adds. */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Interface Parts Manual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<style>
/* Layout: technical-manual spread. Index rail on the left, reading column (prose at about 70ch,
   tables and code allowed wider) in the middle, spec margin with the on-page TOC on the right. */
:root {
  --bg: #e9ecf0;
  --paper: #fbfbfc;
  --ink: #141821;
  --ink-2: #4c5566;
  --ink-3: #737d8f;
  --rule: #cdd3db;
  --rule-strong: #141821;
  --accent: #1d39c4;
  --accent-ink: #ffffff;
  --accent-wash: #e2e7fa;
  --signal: #f3c22e;
  --signal-ink: #1c1600;
  --code-bg: #eef0f4;
  --code-ink: #1a2030;
  --grid: #e3e7ed;
  --warn-ink: #8a4700;
  --warn-bg: #fcefd6;
  --ok-ink: #1b6a39;
  --focus: #1d39c4;
  --shadow: rgba(20, 24, 33, .16);
  --scrim: rgba(20, 24, 33, .42);
  --hl-kw: #a01f78;
  --hl-str: #1c6a3a;
  --hl-num: #995000;
  --hl-com: #6b7485;
  --hl-fn: #1d39c4;
  --hl-attr: #7136b8;
  --hl-tag: #ad2828;
  --hl-var: #0e6c7d;

  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-xs: .6875rem;  /* 11 */
  --t-sm: .8125rem;  /* 13 */
  --t-md: 1.0625rem; /* 17 */
  --t-lg: 1.3125rem; /* 21 */
  --t-xl: 1.75rem;   /* 28 */
  --t-2xl: 2.5rem;   /* 40 */

  --header-h: 56px;
  --rail-w: 272px;
  --toc-w: 228px;
  --safe-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0f14;
    --paper: #12161d;
    --ink: #e3e6eb;
    --ink-2: #a2aab8;
    --ink-3: #747e90;
    --rule: #262c37;
    --rule-strong: #e3e6eb;
    --accent: #92a5ff;
    --accent-ink: #0a0f2e;
    --accent-wash: #1a2241;
    --signal: #e7b622;
    --signal-ink: #1c1600;
    --code-bg: #0e1117;
    --code-ink: #d8dce4;
    --grid: #1a1f28;
    --warn-ink: #f0b663;
    --warn-bg: #2d2311;
    --ok-ink: #7ed29a;
    --focus: #92a5ff;
    --shadow: rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .6);
    --hl-kw: #f08bcd;
    --hl-str: #8ed5a4;
    --hl-num: #f1b46a;
    --hl-com: #7c8597;
    --hl-fn: #a0b1ff;
    --hl-attr: #c6a2ff;
    --hl-tag: #ff8e8e;
    --hl-var: #7ecfdc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f14;
  --paper: #12161d;
  --ink: #e3e6eb;
  --ink-2: #a2aab8;
  --ink-3: #747e90;
  --rule: #262c37;
  --rule-strong: #e3e6eb;
  --accent: #92a5ff;
  --accent-ink: #0a0f2e;
  --accent-wash: #1a2241;
  --signal: #e7b622;
  --signal-ink: #1c1600;
  --code-bg: #0e1117;
  --code-ink: #d8dce4;
  --grid: #1a1f28;
  --warn-ink: #f0b663;
  --warn-bg: #2d2311;
  --ok-ink: #7ed29a;
  --focus: #92a5ff;
  --shadow: rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .6);
  --hl-kw: #f08bcd;
  --hl-str: #8ed5a4;
  --hl-num: #f1b46a;
  --hl-com: #7c8597;
  --hl-fn: #a0b1ff;
  --hl-attr: #c6a2ff;
  --hl-tag: #ff8e8e;
  --hl-var: #7ecfdc;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--safe-top) + var(--header-h) + 16px); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.6;
  overflow-x: hidden;
  overflow-x: clip;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--paper);
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
button { font: inherit; color: inherit; }
::selection { background: var(--signal); color: var(--signal-ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.skip {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(var(--safe-top) + 8px);
  z-index: 60; padding: 10px 14px; background: var(--ink); color: var(--paper);
  font: 600 var(--t-sm)/1 var(--f-mono); text-decoration: none; transform: translateY(-200%);
}
.skip:focus { transform: none; }

/* ---------- header ---------- */
.masthead {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--paper);
  border-bottom: 2px solid var(--rule-strong);
}
.masthead-inner {
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  color: var(--ink); text-decoration: none;
}
.brand-mark {
  flex: none; display: grid; place-items: center;
  width: 34px; height: 34px; background: var(--ink); color: var(--paper);
  font: 700 10px/1 var(--f-mono); letter-spacing: .02em;
}
.brand-name {
  font: 800 1.0625rem/1 var(--f-display); font-stretch: 78%; letter-spacing: .01em;
  text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-rev { font: 500 var(--t-xs)/1 var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.masthead .spacer { flex: 1; }
.hbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; min-width: 36px; padding: 0 10px;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  font: 500 var(--t-sm)/1 var(--f-display); cursor: pointer; text-decoration: none;
}
.hbtn:hover { border-color: var(--ink); }
.hbtn svg { width: 18px; height: 18px; flex: none; }
.hbtn kbd {
  font: 500 10px/1 var(--f-mono); padding: 3px 5px; border: 1px solid var(--rule); color: var(--ink-3);
}
.search-btn { min-width: 220px; justify-content: flex-start; color: var(--ink-2); }
.search-btn .lbl { flex: 1; text-align: left; }
.menu-btn { display: none; }
.lab-link[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- shell ---------- */
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1560px; margin: 0 auto;
}
.rail {
  position: sticky;
  top: calc(var(--safe-top) + var(--header-h) + 2px);
  height: calc(100vh - var(--header-h) - 2px - var(--safe-top));
  height: calc(100dvh - var(--header-h) - 2px - var(--safe-top));
  overflow-y: auto; overscroll-behavior: contain;
  padding-block: 24px 40px; padding-right: 20px;
  border-right: 1px solid var(--rule);
  font-family: var(--f-display);
}
.rail-top { display: grid; gap: 2px; margin-bottom: 20px; }
.nav-sec { margin: 22px 0 6px; display: flex; align-items: baseline; gap: 8px; font: 700 var(--t-xs)/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.nav-sec .code { background: var(--ink); color: var(--paper); padding: 3px 5px 2px; letter-spacing: .04em; }
.nav-sec .n { margin-left: auto; color: var(--ink-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-link {
  display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 6px; align-items: baseline;
  padding: 6px 8px; color: var(--ink); text-decoration: none;
  font-size: .9rem; line-height: 1.3; font-stretch: 94%;
}
.nav-link .c { font: 500 10px/1.3 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-link:hover { background: var(--accent-wash); }
.nav-link[aria-current="page"] { background: var(--ink); color: var(--paper); }
.nav-link[aria-current="page"] .c { color: var(--paper); opacity: .7; }
.rail-foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule); font: 500 var(--t-xs)/1.6 var(--f-mono); color: var(--ink-3); display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; text-align: left; }
.backdrop { display: none; }

.main { min-width: 0; padding-block: 36px 96px; padding-left: clamp(0px, 3.2vw, 56px); }
.view { min-width: 0; }

/* ---------- doc layout ---------- */
.doc-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 48px; align-items: start; }
.doc { min-width: 0; max-width: 980px; }
.toc-rail { display: none; }
@media (min-width: 1280px) {
  .doc-grid { grid-template-columns: minmax(0, 1fr) var(--toc-w); }
  .toc-rail {
    display: block; position: sticky; top: calc(var(--safe-top) + var(--header-h) + 28px);
    max-height: calc(100dvh - var(--header-h) - 56px - var(--safe-top)); overflow-y: auto;
    font-family: var(--f-display); padding-bottom: 24px;
  }
  .toc-inline { display: none; }
}
.toc-title { font: 700 var(--t-xs)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); margin: 0 0 12px; }
.toc-list { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
.toc-list a { display: block; padding: 4px 0 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--ink-2); text-decoration: none; font-size: .84rem; line-height: 1.3; font-stretch: 92%; }
.toc-list .l3 a { padding-left: 24px; font-size: .78rem; color: var(--ink-3); }
.toc-list a:hover { color: var(--ink); }
.toc-list a.is-current { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
.toc-inline { margin: 0 0 28px; border: 1px solid var(--rule); background: var(--paper); font-family: var(--f-display); }
.toc-inline summary { cursor: pointer; padding: 12px 14px; font: 700 var(--t-xs)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; }
.toc-inline summary::-webkit-details-marker { display: none; }
.toc-inline summary::after { content: "+"; }
.toc-inline[open] summary::after { content: "\2212"; }
.toc-inline .toc-list { margin: 0 14px 14px; max-height: 50vh; overflow-y: auto; }

/* spec plate */
.plate {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr));
  border: 2px solid var(--rule-strong); margin-bottom: 28px; background: var(--paper);
}
.plate > div { padding: 10px 12px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; }
.plate dt { font: 600 10px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.plate dd { margin: 4px 0 0; font: 600 .95rem/1.25 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.plate .plate-id { background: var(--ink); color: var(--paper); }
.plate .plate-id dt { color: var(--paper); opacity: .7; }
.plate .plate-id dd { font: 800 1.35rem/1 var(--f-display); font-stretch: 80%; }
.plate dl { margin: 0; }

/* ---------- prose ---------- */
.prose { font-family: var(--f-body); font-size: var(--t-md); line-height: 1.68; min-width: 0; }
.prose > :is(p, ul, ol, blockquote, h1, h2, h3, h4, h5, h6, dl, details) { max-width: 70ch; }
.prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--f-display); text-wrap: balance; color: var(--ink); scroll-margin-top: calc(var(--safe-top) + var(--header-h) + 20px); }
.prose h1 { font-size: clamp(2rem, 1.3rem + 2.4vw, 3rem); line-height: 1.04; font-weight: 800; font-stretch: 106%; letter-spacing: -.018em; margin: 0 0 .6em; }
.prose h2 { font-size: clamp(1.4rem, 1.2rem + .8vw, 1.75rem); line-height: 1.15; font-weight: 760; font-stretch: 100%; letter-spacing: -.01em; margin: 2.4em 0 .7em; padding-top: .7em; border-top: 2px solid var(--rule-strong); max-width: none; }
.prose h3 { font-size: var(--t-lg); line-height: 1.25; font-weight: 700; font-stretch: 96%; margin: 1.9em 0 .5em; }
.prose h4 { font: 700 var(--t-sm)/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; margin: 1.8em 0 .5em; }
.prose h5, .prose h6 { font: 700 1rem/1.3 var(--f-display); margin: 1.5em 0 .4em; }
.prose p { margin: 0 0 1.05em; }
.prose ul, .prose ol { margin: 0 0 1.1em; padding-left: 1.35em; }
.prose li { margin: .28em 0; }
.prose li::marker { color: var(--ink-3); }
.prose li > ul, .prose li > ol { margin: .3em 0 .4em; }
.prose strong { font-weight: 650; }
.prose a { text-decoration-thickness: 1px; text-underline-offset: .18em; overflow-wrap: anywhere; }
.prose a:hover { text-decoration-thickness: 2px; }
.prose a.ext::after { content: "\2197"; font-size: .72em; margin-left: .12em; color: var(--ink-3); text-decoration: none; display: inline-block; }
.prose hr { border: 0; height: 2px; background: var(--rule); margin: 2.4em 0; max-width: none; }
.prose blockquote { margin: 1.4em 0; padding: .85em 1.1em; background: var(--code-bg); border-left: 3px solid var(--ink-3); color: var(--ink-2); }
.prose blockquote > :last-child { margin-bottom: 0; }
.prose blockquote.untested { border-left-color: var(--signal); }
.prose img { display: none; }
.prose :not(pre) > code {
  font-family: var(--f-mono); font-size: .8em; font-stretch: 90%;
  background: var(--code-bg); color: var(--code-ink); padding: .12em .36em; border-radius: 3px;
  overflow-wrap: anywhere;
}
.prose kbd { font: 500 .78em var(--f-mono); border: 1px solid var(--rule); border-bottom-width: 2px; padding: .05em .35em; border-radius: 3px; }
.prose .missing-link { border-bottom: 1px dashed var(--ink-3); color: var(--ink-2); cursor: help; }
.partno {
  display: inline-flex; align-items: baseline; gap: 2px; margin-right: .5em; vertical-align: .18em;
  padding: 5px 7px 4px; background: var(--ink); color: var(--paper);
  font: 700 var(--t-xs)/1 var(--f-mono); letter-spacing: .03em; font-variant-numeric: tabular-nums;
}
.partno small { font-size: 1em; opacity: .6; font-weight: 500; }
.partno.sec { background: transparent; color: var(--ink-3); border: 1px solid var(--rule); }

/* verification markers */
.vm {
  display: inline-block; font: 600 .64rem/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .05em;
  padding: .22em .45em .18em; border: 1px solid var(--rule); color: var(--ink-2); vertical-align: .12em;
  white-space: nowrap; border-radius: 2px;
}
.vm-unverified { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.vm-synthesis { border-style: dashed; }
.vm-sketch, .vm-untested { background: var(--signal); color: var(--signal-ink); border-color: transparent; }
.vm-source { color: var(--ok-ink); border-color: currentColor; }
.vm-editor { background: var(--ink); color: var(--paper); border-color: transparent; }

/* tables */
.table-wrap { overflow-x: auto; margin: 1.6em 0; border-top: 2px solid var(--rule-strong); border-bottom: 1px solid var(--rule); background: var(--paper); max-width: 100%; }
.prose table { border-collapse: collapse; width: 100%; font-family: var(--f-display); font-size: .89rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
.prose th { text-align: left; vertical-align: bottom; font: 650 10.5px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); background: var(--code-bg); }
.prose td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; min-width: 9ch; }
.prose tbody tr:last-child td { border-bottom: 0; }
.prose tbody tr:hover td { background: var(--accent-wash); }
.prose td:first-child { font-weight: 600; }
.prose td code { font-size: .78em; }

/* code */
.code { margin: 1.5em 0; border: 1px solid var(--rule); background: var(--code-bg); min-width: 0; max-width: 100%; }
.code-bar { display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; border-bottom: 1px solid var(--rule); min-height: 34px; }
.code-lang { font: 700 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.code-bar .gap { flex: 1; }
.copy {
  align-self: stretch; border: 0; border-left: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  font: 600 10.5px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; padding: 0 14px; cursor: pointer;
}
.copy:hover { background: var(--paper); color: var(--ink); }
.copy.done { color: var(--ok-ink); }
.code pre { margin: 0; overflow-x: auto; padding: 14px 16px 16px; font-family: var(--f-mono); font-size: .78rem; font-stretch: 88%; line-height: 1.65; color: var(--code-ink); tab-size: 2; }
.code pre code { font: inherit; background: none; padding: 0; white-space: pre; }

/* highlight.js theme mapped to tokens */
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-meta .hljs-keyword { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-meta .hljs-string, .hljs-char.escape_ { color: var(--hl-str); }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--hl-num); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section, .hljs-selector-id, .hljs-selector-class { color: var(--hl-fn); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--hl-attr); }
.hljs-name, .hljs-tag, .hljs-deletion { color: var(--hl-tag); }
.hljs-variable, .hljs-template-variable, .hljs-built_in, .hljs-type, .hljs-params, .hljs-meta { color: var(--hl-var); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* pager */
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 64px; border-top: 2px solid var(--rule-strong); }
.pager a { display: grid; gap: 6px; padding: 18px 16px 20px 0; color: var(--ink); text-decoration: none; min-width: 0; }
.pager a + a, .pager .next { text-align: right; padding: 18px 0 20px 16px; }
.pager .next { grid-column: 2; }
.pager .k { font: 600 var(--t-xs)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.pager .t { font: 700 1.05rem/1.25 var(--f-display); font-stretch: 94%; text-wrap: balance; }
.pager a:hover .t { color: var(--accent); }

/* ---------- home ---------- */
.home { display: grid; gap: 72px; max-width: 1180px; }
.eyebrow { font: 600 var(--t-xs)/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.cover { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; padding-top: 8px; }
@media (min-width: 1100px) { .cover { grid-template-columns: minmax(0, 1fr) 320px; align-items: end; } }
.cover-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 22px; }
.cover-title {
  margin: 0; font-family: var(--f-display); font-weight: 860; font-stretch: 112%;

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script>
(function () {
  'use strict';

  /* ================= data ================= */
  const DOCS = Array.isArray(window.UIFG_DOCS) ? window.UIFG_DOCS : [];
  const AS_OF = '5 Nov 2026';
  const SECTION_META = {
    Start: { code: 'ST', name: 'Start here' },
    Foundations: { code: 'FD', name: 'Foundations' },
    Components: { code: 'CP', name: 'Components' },
    Animations: { code: 'AN', name: 'Animations' },
    Assets: { code: 'AS', name: 'Assets' },
    Report: { code: 'RP', name: 'Master report' },
  };
  const SECTION_ORDER = Object.keys(SECTION_META);
  const byId = new Map();
  const byPath = new Map();
  const counters = {};
  DOCS.forEach((d, i) => {
    counters[d.section] = (counters[d.section] || 0) + 1;
    d.index = i;
    d.code = (SECTION_META[d.section] || { code: 'XX' }).code + '-' + String(counters[d.section]).padStart(2, '0');
    byId.set(d.id, d);
    byPath.set(d.path, d);
  });

  function stats(d) {
    if (d._stats) return d._stats;
    const lines = d.md.split('\n');
    let fences = 0, tables = 0, inFence = false;
    for (const l of lines) {
      if (/^\s*(```|~~~)/.test(l)) { fences++; inFence = !inFence; continue; }
      if (!inFence && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l)) tables++;
    }
    const words = (d.md.match(/[A-Za-z0-9À-ɏ][\w'’-]*/g) || []).length;
    const links = (d.md.match(/\]\(https?:\/\//g) || []).length;
    d._stats = { words, code: Math.floor(fences / 2), tables, links, minutes: Math.max(1, Math.round(words / 230)) };
    return d._stats;
  }

  /* ================= helpers ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => n.toLocaleString('en-GB');
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };
  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');

  // GitHub-style heading slug: lowercase, drop punctuation except hyphens/underscores, spaces -> hyphens.
  function slug(text) {
    return String(text).trim().toLowerCase()
      .replace(/[^\p{L}\p{M}\p{N}\p{Pc}\- ]/gu, '')
      .replace(/ /g, '-');
  }
  function mdInline(s) {
    return String(s)
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/<[^>]+>/g, (m) => /^<\/?[a-z][\w-]*(\s[^>]*)?>$/i.test(m) && !/^<\/?(code|em|strong|b|i|kbd|span|a|sup|sub|br)\b/i.test(m) ? m : '')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/(\*\*|__)(.*?)\1/g, '$2')
      .replace(/(^|[^\w*])[*_]([^*_]+)[*_](?=[^\w*]|$)/g, '$1$2')
      .replace(/\\([\\`*_{}[\]()#+\-.!|])/g, '$1')
      .trim();
  }
  function resolvePath(base, rel) {
    const parts = base.split('/'); parts.pop();
    rel.split('/').forEach((seg) => {
      if (seg === '..') parts.pop();
      else if (seg && seg !== '.') parts.push(seg);
    });
    return parts.join('/');
  }
  function findDocByPath(p, isDir) {
    p = p.replace(/\/+$/, '');
    if (!isDir && byPath.has(p)) return byPath.get(p);
    if (!isDir && !/\.md$/i.test(p) && byPath.has(p + '.md')) return byPath.get(p + '.md');
    const folder = p;
    const readme = DOCS.find((d) => d.path.toLowerCase() === (folder + '/readme.md').toLowerCase());
    if (readme) return readme;
    // Folder without a README: fall back to the first doc inside it.
    return DOCS.find((d) => d.path.startsWith(folder + '/')) || null;
  }
  function anchorFor(docId, headingText) {
    return { id: docId, anchor: slug(mdInline(headingText)), heading: mdInline(headingText) };
  }

  /* ================= theme ================= */
  const root = document.documentElement;
  const themeBtn = $('#theme-btn');
  function effectiveTheme() { return root.dataset.theme || (darkMQ.matches ? 'dark' : 'light'); }
  function syncThemeUI() {
    const t = effectiveTheme();
    themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    themeBtn.title = themeBtn.getAttribute('aria-label');
    const st = $('#theme-state');
    if (st) {
      const explicit = root.dataset.theme;
      st.innerHTML = explicit
        ? 'Theme: ' + explicit + ' (your choice). <button class="linkbtn" type="button" id="theme-reset">Follow system</button>'

        const MAX = 10;
        card.addEventListener('pointermove', (e) => {
          if (!fine.matches || still.matches) return;
          const r = card.getBoundingClientRect();
          const px = (e.clientX - r.left) / r.width - 0.5;
          const py = (e.clientY - r.top) / r.height - 0.5;
          card.classList.add('is-tracking');
          card.style.transform = `rotateX(${-py * MAX * 2}deg) rotateY(${px * MAX * 2}deg)`;
        });
        card.addEventListener('pointerleave', () => {
          card.classList.remove('is-tracking');
          card.style.transform = '';
        });
      },
    },
    {
      title: 'Bar loader', tags: 'CSS · role=status',
      note: 'Four bars scale from the baseline on a staggered loop, and screen readers hear a status message. With reduced motion the bars pulse in opacity only.',

  <span class="m-sr">Loading results</span>
</div>`,

.m-loader-bar:nth-child(3) { animation-delay: -.7s; }
.m-loader-bar:nth-child(4) { animation-delay: -.55s; background: var(--accent); }
@keyframes m-bars { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

@media (prefers-reduced-motion: reduce) {

    {

      html: `<div class="m-toast-demo">
  <button class="m-toast-btn" type="button">Save draft</button>

</div>`,
      css: `.m-toast-demo { display: grid; place-items: center; width: 100%; min-height: 200px; }
.m-toast-btn {
  padding: .9em 1.4em; border: 2px solid var(--ink); background: var(--ink); color: var(--paper);

}

}
.m-toast {

}

  width: 28px; height: 28px; border: 0; border-radius: 6px;

}
.m-toast.is-leaving { animation: m-toast-out .2s ease-in forwards; }
@keyframes m-toast-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes m-toast-out { to { opacity: 0; transform: translateY(6px); } }
@keyframes m-toast-fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {

      init: function toasts(root) {
        const list = root.querySelector('.m-toasts');
        const btn = root.querySelector('.m-toast-btn');
        let count = 0;
        const dismiss = (li) => {
          if (li.classList.contains('is-leaving')) return;
          li.classList.add('is-leaving');
          li.addEventListener('animationend', () => li.remove(), { once: true });
          setTimeout(() => li.remove(), 400);
        };
        btn.addEventListener('click', () => {
          count += 1;
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const li = document.createElement('li');
          li.className = 'm-toast';
          li.innerHTML = `<span>Draft ${count} saved at ${time}</span><button type="button" aria-label="Dismiss">×</button>`;
          li.querySelector('button').addEventListener('click', () => dismiss(li));
          list.append(li);
          while (list.children.length > 3) list.firstElementChild.remove();
          let timer = setTimeout(() => dismiss(li), 4000);
          li.addEventListener('pointerenter', () => clearTimeout(timer));
          li.addEventListener('pointerleave', () => { timer = setTimeout(() => dismiss(li), 2000); });
        });
      },
    },

      html: `<div class="m-vt-wrap">

</div>`,

.m-vt {
  padding: .95em 1.6em; border: 2px solid var(--ink); border-radius: 999px;

}
.m-vt-note { margin: 0; font: 500 .75rem/1.4 var(--f-mono); color: var(--ink-2); text-align: center; }
/* Turn off the default cross-fade so only the clip-path reveal plays. */
::view-transition-old(root),

      init: function themeReveal(root) {
        const btn = root.querySelector('.m-vt');
        const note = root.querySelector('.m-vt-note');
        const html = document.documentElement;
        const canVT = typeof document.startViewTransition === 'function';
        note.textContent = canVT ? 'Using document.startViewTransition()' : 'No View Transitions here: the theme switches instantly.';
        btn.addEventListener('click', () => {
          const current = html.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          const apply = () => { html.dataset.theme = current === 'dark' ? 'light' : 'dark'; };
          if (!canVT || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }
          const r = btn.getBoundingClientRect();
          const x = r.left + r.width / 2;
          const y = r.top + r.height / 2;
          const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
          const vt = document.startViewTransition(apply);
          vt.ready.then(() => {
            html.animate(
              { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
              { duration: 550, easing: 'cubic-bezier(.2, .7, .2, 1)', pseudoElement: '::view-transition-new(root)' }
            );
          }).catch(() => {});
        });
      },
    },
    {
      title: 'Skeleton shimmer', tags: 'CSS · aria-busy',
      note: 'Placeholder blocks match the final layout and a highlight sweeps across them. With reduced motion the blocks stay still.',

  <div class="m-skel-line"></div>

</div>`,
      css: `.m-skel { display: grid; gap: 10px; width: min(100%, 20rem); }

  background-size: 300% 100%;

.m-skel-media { aspect-ratio: 16 / 9; max-width: 100%; }
.m-skel-line { height: 12px; }
.m-skel-line--short { width: 60%; }
@keyframes m-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) {

  function dedent(src) {
    const lines = src.split('\n');
    const rest = lines.slice(1).filter((l) => l.trim());
    const min = rest.length ? Math.min.apply(null, rest.map((l) => l.match(/^ */)[0].length)) : 0;
    const out = [lines[0]].concat(lines.slice(1).map((l) => l.slice(Math.min(min, l.match(/^ */)[0].length))));
    // the closing brace sits at (min - 2) indentation in the source
    return out.join('\n').replace(/\n\s*}$/, '\n}');
  }

  // Inject all demo CSS once so the header theme toggle shares the view-transition rules.
  (function injectDemoCss() {
    const s = document.createElement('style');
    s.id = 'lab-css';
    s.textContent = DEMOS.map((d) => d.css).join('\n\n');
    document.head.appendChild(s);
  })();

  function renderLab() {
    document.title = 'Motion lab · Interface Parts Manual';
    let h = '<div class="lab"><header class="lab-intro"><span class="eyebrow">LAB · ' + DEMOS.length + ' live specimens · all respect reduced motion</span>' +
      '<h1>Motion lab</h1><p>Working versions of techniques from the docs. Each specimen runs on this page, shows its full source and links to the section it comes from. The CSS uses this manual’s colour tokens (<code>--ink</code>, <code>--paper</code>, <code>--accent</code>, <code>--rule</code>), so rename them to your own when you copy.</p></header><div class="lab-grid">';
    DEMOS.forEach((d, i) => {
      const refs = d.refs.filter(([id]) => byId.has(id)).map(([id, head]) => {
        const doc = byId.get(id);
        return '<a href="#' + id + '"' + (head ? ' data-anchor="' + esc(slug(mdInline(head))) + '" data-heading="' + esc(mdInline(head)) + '"' : '') + '>' + doc.code + (head ? ' · ' + esc(mdInline(head).replace(/\s*\(.*\)$/, '')) : ' · ' + esc(shortTitle(doc))) + ' →</a>';
      }).join('');
      h += '<section class="specimen" id="demo-' + (i + 1) + '" aria-labelledby="demo-h-' + (i + 1) + '">' +
        '<div class="specimen-h"><span class="code-id">M-' + String(i + 1).padStart(2, '0') + '</span><h2 id="demo-h-' + (i + 1) + '">' + esc(d.title) + '</h2><span class="tags">' + esc(d.tags) + '</span></div>' +
        '<div class="stage"><div class="stage-stack">' + d.html + '</div></div>' +
        '<div class="specimen-note"><p>' + esc(d.note) + '</p>' + (refs ? '<div class="specimen-refs">' + refs + '</div>' : '') + '</div>' +
        '<div class="code-slot"></div></section>';
    });
    h += '</div></div>';
    view.innerHTML = h;
    DEMOS.forEach((d, i) => {
      const sec = $('#demo-' + (i + 1));
      const panes = [['HTML', 'xml', d.html], ['CSS', 'css', d.css]];
      if (d.init) panes.push(['JS', 'javascript', dedent(d.init.toString())]);
      const tabs = document.createElement('div');
      tabs.className = 'tabs';
      tabs.setAttribute('role', 'tablist');
      tabs.setAttribute('aria-label', d.title + ' source');
      const pres = panes.map(([label, lang, src], k) => {
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = src;
        highlight(code, lang);
        pre.appendChild(code);
        pre.tabIndex = 0;
        pre.id = 'demo-' + (i + 1) + '-' + label.toLowerCase();
        pre.setAttribute('role', 'tabpanel');
        if (k) pre.hidden = true;
        const t = document.createElement('button');
        t.type = 'button'; t.className = 'tab'; t.textContent = label;
        t.setAttribute('role', 'tab');
        t.setAttribute('aria-controls', pre.id);
        t.setAttribute('aria-selected', k ? 'false' : 'true');
        tabs.appendChild(t);
        return pre;
      });
      tabs.addEventListener('click', (e) => {
        const t = e.target.closest('.tab');
        if (!t) return;
        $$('.tab', tabs).forEach((b, k) => {
          const on = b === t;
          b.setAttribute('aria-selected', on ? 'true' : 'false');
          pres[k].hidden = !on;
        });
      });
      const fig = makeCodeFigure(pres[0], '', tabs);
      pres.slice(1).forEach((p) => fig.appendChild(p));
      sec.querySelector('.code-slot').replaceWith(fig);
      if (d.init) {
        try { d.init(sec.querySelector('.stage')); } catch (e) { /* demo failed to start */ }
      }
    });
  }

  /* ================= search ================= */
  const searchDlg = $('#search-dlg');
  const searchInput = $('#search-input');
  const resultsEl = $('#results');
  const metaEl = $('#search-meta');
  let INDEX = null;
  let activeIdx = -1;

  function buildIndex() {
    INDEX = [];
    DOCS.forEach((d) => {
      let cur = { doc: d, heading: '', level: 1, lines: [] };
      const push = () => {
        const text = cur.lines.join(' ').replace(/\s+/g, ' ').trim();
        if (text || cur.heading) INDEX.push({ doc: d, heading: cur.heading, level: cur.level, text, low: text.toLowerCase(), headLow: cur.heading.toLowerCase() });
      };
      let inFence = false;
      d.md.split('\n').forEach((l) => {
        if (/^\s*(```|~~~)/.test(l)) { inFence = !inFence; return; }
        const m = !inFence && l.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);
        if (m) {
          push();
          cur = { doc: d, heading: mdInline(m[2]), level: m[1].length, lines: [] };
          return;
        }
        let t = l;
        if (!inFence) {
          if (/^\s*\|?\s*:?-{3,}/.test(t)) return;
          t = mdInline(t.replace(/^\s*>\s?/, '').replace(/^\s*([-*+]|\d+\.)\s+/, '').replace(/\|/g, ' · '));
        }
        if (t.trim()) cur.lines.push(t);
      });
      push();
      d._titleLow = d.title.toLowerCase();
    });
  }

  function search(q) {
    if (!INDEX) buildIndex();
    const query = q.trim().toLowerCase();
    const terms = query.split(/\s+/).filter((t) => t.length >= 2 || /\d/.test(t));
    if (!terms.length) return [];
    const res = [];
    INDEX.forEach((s) => {
      let score = 0;
      for (const t of terms) {
        let hit = 0;
        if (s.doc._titleLow.includes(t)) { score += 6; hit = 1; }
        if (s.headLow.includes(t)) { score += 12; hit = 1; }
        let c = 0, i = s.low.indexOf(t);
        while (i !== -1 && c < 12) { c++; i = s.low.indexOf(t, i + t.length); }
        if (c) { score += 2 + c; hit = 1; }
        if (!hit) return;
      }
      if (terms.length > 1) {
        if (s.headLow.includes(query)) score += 20;
        else if (s.low.includes(query)) score += 8;
      }
      if (s.level <= 2) score += 1;
      res.push({ s, score });
    });
    res.sort((a, b) => b.score - a.score);
    const perDoc = new Map();
    const out = [];
    for (const r of res) {
      const n = perDoc.get(r.s.doc.id) || 0;
      if (n >= 5) continue;
      perDoc.set(r.s.doc.id, n + 1);
      out.push(r.s);
      if (out.length >= 40) break;
    }
    return { list: out, terms, total: res.length };
  }

  function snippet(text, terms) {
    if (!text) return '';
    const low = text.toLowerCase();
    let at = -1;
    for (const t of terms) { const i = low.indexOf(t); if (i !== -1 && (at === -1 || i < at)) at = i; }
    let start = Math.max(0, at - 70);
    if (start > 0) { const sp = text.indexOf(' ', start); if (sp !== -1 && sp < at) start = sp + 1; }
    let s = text.slice(start, start + 200);
    const pre = start > 0 ? '…' : '', post = start + 200 < text.length ? '…' : '';
    s = esc(s);
    const re = new RegExp('(' + terms.map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return pre + s.replace(re, '<mark>$1</mark>') + post;
  }
  function hlText(text, terms) {
    const re = new RegExp('(' + terms.map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return esc(text).replace(re, '<mark>$1</mark>');
  }

  function runSearch() {
    const q = searchInput.value;
    activeIdx = -1;
    if (!q.trim()) {
      metaEl.textContent = 'Search ' + DOCS.length + ' documents. Try a component, a CSS property or a licence.';
      resultsEl.innerHTML = '<li class="search-empty">Suggestions: ' +
        ['command palette', 'view transitions', 'prefers-reduced-motion', 'OFL', 'skeleton', 'anchor positioning'].map((s) => '<button class="hbtn" type="button" data-suggest="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</li>';
      return;
    }
    const r = search(q);
    if (!r.list || !r.list.length) {
      metaEl.textContent = 'No matches for “' + q.trim() + '”.';
      resultsEl.innerHTML = '<li class="search-empty">Nothing matched every word. Try fewer or shorter terms.</li>';
      return;
    }
    metaEl.textContent = r.total + ' matching sections' + (r.total > r.list.length ? ', showing the best ' + r.list.length : '') + '. Use arrow keys and Enter.';
    resultsEl.innerHTML = r.list.map((s) =>
      '<li><a href="#' + s.doc.id + '"' + (s.heading ? ' data-anchor="' + esc(slug(s.heading)) + '" data-heading="' + esc(s.heading) + '"' : '') + '>' +
      '<span class="r-path">' + s.doc.code + ' · ' + esc(shortTitle(s.doc)) + '</span>' +
      '<span class="r-head">' + hlText(s.heading || s.doc.title, r.terms) + '</span>' +
      (s.text ? '<span class="r-snip">' + snippet(s.text, r.terms) + '</span>' : '') +
      '</a></li>').join('');
  }
  let searchTimer;
  searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 90); });
  searchInput.addEventListener('keydown', (e) => {
    const links = $$('a', resultsEl);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!links.length) return;
      e.preventDefault();
      activeIdx = e.key === 'ArrowDown' ? Math.min(links.length - 1, activeIdx + 1) : Math.max(0, activeIdx - 1);
      links.forEach((a, i) => a.classList.toggle('is-active', i === activeIdx));
      links[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      const a = links[activeIdx >= 0 ? activeIdx : 0];
      if (a) { e.preventDefault(); a.click(); }
    }
  });
  resultsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-suggest]');
    if (b) { searchInput.value = b.dataset.suggest; runSearch(); searchInput.focus(); }
  });
  function openSearch(q) {
    if (!searchDlg.open) {
      if (typeof searchDlg.showModal === 'function') searchDlg.showModal(); else searchDlg.setAttribute('open', '');
    }
    if (typeof q === 'string') searchInput.value = q;
    runSearch();
    searchInput.focus();
    searchInput.select();
  }
  $('#search-btn').addEventListener('click', () => openSearch());
  $('#search-close').addEventListener('click', () => searchDlg.close());
  searchDlg.addEventListener('click', (e) => { if (e.target === searchDlg) searchDlg.close(); });
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable);
    if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openSearch(); return; }
    if (e.key === '/' && !typing && !searchDlg.open) { e.preventDefault(); openSearch(); return; }
    if (e.key === 'Escape') {
      if (rail.classList.contains('open')) closeRail(true);
      else if (searchDlg.open && !searchDlg.showModal) searchDlg.removeAttribute('open');
    }
  });

  /* ================= boot ================= */
  buildRail();
  syncThemeUI();
  if (!DOCS.length) {
    view.innerHTML = '<div class="notfound"><span class="eyebrow">Content missing</span><h1>No documents loaded</h1><p>content.js did not load. Run <code>node website/build.mjs</code> and keep content.js next to this page.</p></div>';
  } else {
    route();
  }
})();
</script>
