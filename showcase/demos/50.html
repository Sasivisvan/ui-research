<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Theme, language switchers and back-to-top</title>
<style>
:root{--bg:#f2eee4;--fg:#15130e}html[data-t=dark]{--bg:#15130e;--fg:#f2eee4;--p2:#26241f;--line:rgba(242,238,228,.22)}
@media (prefers-color-scheme:dark){html[data-t=system]{--bg:#15130e;--fg:#f2eee4;--p2:#26241f;--line:rgba(242,238,228,.22)}}
body{padding:0;background:var(--bg);color:var(--fg);transition:background .4s,color .4s}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--fg);background:var(--bg)}
.th{display:inline-flex;border:1.5px solid var(--fg);border-radius:99px;padding:3px}
.th button{min-width:44px;min-height:38px;border:0;background:none;color:inherit;border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:600;padding:0 12px}.th button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.lg{min-height:44px;background:none;border:1.5px solid var(--fg);color:inherit;padding:0 10px}
.lg option{color:#000}
main{max-width:620px;margin:auto;padding:32px 20px 40px}main h1{font:300 clamp(2rem,7vw,3.4rem)/1 var(--serif);margin:0 0 12px}main p{margin:0 0 14px;opacity:.8;min-height:3em}
.top{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--p2,#e6e0d0) 0);cursor:pointer;opacity:0;transform:translateY(20px);pointer-events:none;transition:.4s cubic-bezier(.2,.8,.2,1);--p:0}
.top::before{content:"↑";position:absolute;inset:4px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:1.3rem}
.top.on{opacity:1;transform:none;pointer-events:auto}
</style>
<header><div class="th" role="group" aria-label="Theme" id="th"><button data-t="system" aria-pressed="true">Auto</button><button data-t="light" aria-pressed="false">Light</button><button data-t="dark" aria-pressed="false">Dark</button></div>
<select class="lg" id="lg" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="ja">日本語</option></select></header>
<main><h1 id="h">Hello</h1><p id="p">Language names are written in their own language.</p>
<p>Scroll down. The button appears only when you scroll up — intent, not distance. The ring shows how far you are.</p><div style="height:160vh"></div><p>The end.</p></main>
<button class="top" id="tp" aria-label="Back to top"></button>
<script>
const R=document.documentElement;R.dataset.t='system';
th.onclick=e=>{const b=e.target.closest('button');if(!b)return;R.dataset.t=b.dataset.t;[...th.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};
const T={en:['Hello','Language names are written in their own language.'],es:['Hola','Los idiomas se escriben en su propio idioma.'],de:['Hallo','Sprachen stehen in ihrer eigenen Sprache.'],ja:['こんにちは','言語名はその言語で表示します。']};
lg.onchange=()=>{R.lang=lg.value;h.textContent=T[lg.value][0];p.textContent=T[lg.value][1]};
let y=scrollY;addEventListener('scroll',()=>{const n=scrollY,max=R.scrollHeight-innerHeight;tp.style.setProperty('--p',n/max*100);tp.classList.toggle('on',n<y&&n>200);y=n},{passive:true});
tp.onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
</script>
