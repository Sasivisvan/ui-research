<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Buttons</title>
<style>
.c{grid-template-columns:repeat(auto-fit,minmax(200px,max-content));justify-content:center;gap:24px 28px;max-width:760px;margin:auto}
.b{min-height:48px;padding:0 24px;border:1.5px solid var(--ink);background:none;border-radius:2px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform 60ms}
.b:active{transform:scale(.97)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (hover:hover){.primary:hover{background:color-mix(in oklab,var(--accent),black 10%)}.outline:hover{background:var(--ink);color:var(--paper)}}
.ghost{border-color:transparent;background:var(--p2)}
.ico{width:48px;padding:0;border-radius:50%;font-size:1.2rem}
/* 3D press */
.p3{position:relative;border:0;background:none;padding:0;cursor:pointer}
.p3 i{position:absolute;inset:0;background:#0006;border-radius:2px;transform:translateY(4px)}
.p3 b{position:relative;display:block;padding:14px 28px;background:var(--ink);color:var(--paper);border-radius:2px;transform:translateY(-4px);transition:transform 250ms cubic-bezier(.3,.7,.4,1.5)}
.p3:hover b{transform:translateY(-6px)}.p3:active b{transform:translateY(-1px);transition-duration:34ms}
/* magnetic */
.mag{border-radius:99px;min-height:56px;padding:0 32px;background:var(--ink);color:var(--paper);border:0;transition:transform .5s cubic-bezier(.3,.7,.4,1.5)}
.mag span{display:block;transition:transform .5s cubic-bezier(.3,.7,.4,1.5)}
/* stateful */
.st{min-width:150px}.st[data-s=load]{pointer-events:none}.st[data-s=done]{background:#1d8a4a;border-color:#1d8a4a;color:#fff}
.sp{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes r{to{transform:rotate(1turn)}}
/* split */
.split{display:inline-flex;position:relative}
.split .b:first-child{border-radius:2px 0 0 2px}.split .b:last-child{border-radius:0 2px 2px 0;border-left-color:rgba(255,255,255,.5);padding:0 14px}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:180px;background:var(--paper);border:1px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:4px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;cursor:pointer}.menu button:hover{background:var(--p2)}
</style>
<div class="c">
<button class="b primary">Primary</button><button class="b outline">Secondary</button><button class="b ghost">Ghost</button>
<button class="b ico" aria-label="Favourite">♡</button>
<button class="p3"><i></i><b>3D press</b></button>
<button class="mag" id="mag"><span>Magnetic</span></button>
<button class="b st" id="st">Save changes</button>
<div class="split"><button class="b primary">Publish</button><button class="b primary" id="sp" aria-haspopup="menu" aria-expanded="false" aria-label="More publish options">▾</button><div class="menu" id="mn" role="menu"><button role="menuitem">Schedule…</button><button role="menuitem">Save draft</button></div></div>
</div>
<script>
const m=document.getElementById('mag');
if(matchMedia('(hover:hover) and (pointer:fine)').matches){m.addEventListener('pointermove',e=>{const r=m.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;m.style.transform=`translate(${x*.3}px,${y*.4}px)`;m.firstElementChild.style.transform=`translate(${x*.12}px,${y*.15}px)`});m.addEventListener('pointerleave',()=>{m.style.transform='';m.firstElementChild.style.transform=''})}
const st=document.getElementById('st');st.style.minWidth=st.offsetWidth+'px';
st.onclick=()=>{st.dataset.s='load';st.innerHTML='<span class="sp"></span>Saving';setTimeout(()=>{st.dataset.s='done';st.textContent='Saved ✓';setTimeout(()=>{delete st.dataset.s;st.textContent='Save changes'},1500)},1100)};
const sp=document.getElementById('sp'),mn=document.getElementById('mn');sp.onclick=()=>{const o=mn.classList.toggle('on');sp.setAttribute('aria-expanded',o)};
addEventListener('keydown',e=>e.key==='Escape'&&(mn.classList.remove('on'),sp.setAttribute('aria-expanded',false)));
</script>
