<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Bento grids and masonry</title>
<style>
.g{display:grid;gap:12px;max-width:960px;margin:auto;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(130px,auto)}
.t{border:1.5px solid var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
.t:hover{transform:translateY(-4px)}
.t b{font:300 clamp(1.4rem,3vw,2.2rem)/1.05 var(--serif)}.t small{font:500 .68rem var(--mono);text-transform:uppercase;opacity:.6}
.a{grid-column:span 2;grid-row:span 2;background:var(--accent);color:#fff;border-color:var(--accent)}.a b{font-size:clamp(2rem,5vw,3.6rem)}
.b{grid-column:span 2}.d{grid-row:span 2;background:var(--ink);color:var(--paper)}
.e{background:var(--p2)}.f{grid-column:span 2}
.t i{position:absolute;right:-20px;bottom:-30px;font:300 8rem/1 var(--serif);opacity:.12;font-style:normal}
@media (max-width:640px){.g{grid-template-columns:repeat(2,1fr)}.a{grid-column:span 2}.f{grid-column:span 2}}
</style>
<div class="c"><div class="g">
<div class="t a"><small>Featured</small><b>Asymmetry gives the eye somewhere to start.</b><i>01</i></div>
<div class="t b"><small>Speed</small><b>0.8s LCP</b></div>
<div class="t d"><small>Rule</small><b>One big tile per grid.</b></div>
<div class="t e"><small>Mobile</small><b>2 cols</b></div>
<div class="t f"><small>Tip</small><b>Vary spans, keep gaps identical.</b></div></div></div>
