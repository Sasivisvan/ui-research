<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Date pickers</title>
<style>
.cal{width:min(340px,100%);margin:auto;border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--paper);padding:16px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hd b{font:400 1.5rem var(--serif)}
.hd button{width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:1.1rem;border-radius:2px}.hd button:hover{background:var(--p2)}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.g span{font:500 .65rem var(--mono);opacity:.5;padding:6px 0;text-transform:uppercase}
.g button{aspect-ratio:1;border:0;background:none;cursor:pointer;border-radius:2px;font-variant-numeric:tabular-nums;font-size:.9rem}
.g button:hover{background:var(--p2)}.g button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.g button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}.g button:disabled{opacity:.25;cursor:default}
.out{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font:500 .8rem var(--mono)}
</style>
<div class="c"><div class="cal"><div class="hd"><button id="pv" aria-label="Previous month">←</button><b id="m" aria-live="polite"></b><button id="nx" aria-label="Next month">→</button></div><div class="g" id="g" role="grid"></div><div class="out" id="o">No date selected</div></div></div>
<script>
const now=new Date();let y=now.getFullYear(),mo=now.getMonth(),sel=null;
const g=document.getElementById('g');
function draw(){const first=new Date(y,mo,1),off=(first.getDay()+6)%7,n=new Date(y,mo+1,0).getDate();
 document.getElementById('m').textContent=first.toLocaleString('en',{month:'long',year:'numeric'});
 g.innerHTML=['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<span>${d}</span>`).join('')+'<i></i>'.repeat(off)+Array.from({length:n},(_,i)=>{const d=new Date(y,mo,i+1),past=d<new Date(now.getFullYear(),now.getMonth(),now.getDate());const isSel=sel&&+d===+sel;return `<button data-d="${i+1}" aria-pressed="${!!isSel}" ${past?'disabled':''} class="${+d===+new Date(now.getFullYear(),now.getMonth(),now.getDate())?'today':''}" aria-label="${d.toDateString()}">${i+1}</button>`}).join('')}
g.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;sel=new Date(y,mo,+b.dataset.d);o.textContent=sel.toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'});draw()};
pv.onclick=()=>{mo--;if(mo<0){mo=11;y--}draw()};nx.onclick=()=>{mo++;if(mo>11){mo=0;y++}draw()};draw();
</script>
