<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Mobile bottom tab bar</title>
<style>
body{padding:0;display:grid;place-items:center;background:var(--p2)}
.phone{width:min(390px,100%);height:min(100svh,720px);position:relative;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;border-inline:1px solid var(--line)}
.screen{flex:1;display:grid;place-items:center;font:300 3rem var(--serif);letter-spacing:-.02em;padding:24px;text-align:center}
.screen small{display:block;font:500 .7rem var(--mono);text-transform:uppercase;opacity:.55;margin-top:8px}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;min-height:60px;display:grid;place-items:center;gap:0;padding:8px 0;cursor:pointer;font:600 .7rem system-ui;color:#6b6558;transition:color .2s}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
.ind{position:absolute;top:-1px;left:0;width:25%;height:3px;background:var(--accent);transform:translateX(calc(var(--i)*100%));transition:transform .4s cubic-bezier(.3,.7,.4,1.4)}
</style>
<div class="phone"><div class="screen" id="v">Home<small>thumb zone · safe-area aware</small></div>
<nav class="tabs" role="tablist" aria-label="Main" id="n" style="--i:0"><span class="ind"></span>
<button role="tab" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Home</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 5H4zM4 8v13h16V8"/></svg>Bag</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>You</button></nav></div>
<script>
const n=document.getElementById('n'),tabs=[...n.querySelectorAll('button')];
tabs.forEach((b,i)=>b.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-selected',x===b));n.style.setProperty('--i',i);document.getElementById('v').firstChild.textContent=b.textContent})
</script>
