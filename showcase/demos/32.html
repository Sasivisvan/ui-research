<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Toasts and notifications</title>
<style>
.c{grid-auto-flow:column;gap:10px;justify-content:center;grid-auto-columns:max-content}@media (max-width:520px){.c{grid-auto-flow:row}}
.b{min-height:48px;padding:0 20px;border:1.5px solid var(--ink);background:none;font-weight:600;cursor:pointer;border-radius:2px}.b:hover{background:var(--ink);color:var(--paper)}
#tw{position:fixed;right:16px;bottom:16px;left:16px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:8px;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
.t{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:min(360px,100%);padding:14px 14px 14px 16px;background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--accent);position:relative;overflow:hidden;animation:in .45s cubic-bezier(.3,.7,.4,1.3);touch-action:pan-y;transition:transform .3s,opacity .3s}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.95)}}
.t.out{opacity:0;transform:translateX(30px)}
.t b{font-size:.92rem}.t span{font-size:.8rem;opacity:.7;display:block}.t i{font-style:normal;font-size:1.2rem}.t button{border:0;background:none;color:inherit;cursor:pointer;width:36px;height:36px;font-size:1rem}
.t u{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:100%;transform-origin:left;animation:p var(--d) linear forwards}
.t:hover u,.t:focus-within u{animation-play-state:paused}@keyframes p{to{transform:scaleX(0)}}
</style>
<div class="c"><button class="b" data-k="ok">Success</button><button class="b" data-k="err">Error</button><button class="b" data-k="info">Info</button></div>
<div id="tw" role="region" aria-label="Notifications" aria-live="polite"></div>
<script>
const M={ok:['✓','Saved','Your changes are live.'],err:['!','Upload failed','Check your connection.'],info:['i','New version','Reload to update.']};let n=0;
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const[ic,t,s]=M[b.dataset.k],el=document.createElement('div');el.className='t';el.style.setProperty('--d','4.5s');
 el.innerHTML=`<i aria-hidden="true">${ic}</i><div><b>${t}</b><span>${s}</span></div><button aria-label="Dismiss">✕</button><u></u>`;
 const kill=()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)};el.querySelector('button').onclick=kill;el.querySelector('u').addEventListener('animationend',kill);
 let x0=null;el.onpointerdown=e=>{x0=e.clientX};el.onpointerup=e=>{if(x0!==null&&e.clientX-x0>60)kill();x0=null};
 tw.append(el);while(tw.children.length>3)tw.firstChild.remove()});
</script>
