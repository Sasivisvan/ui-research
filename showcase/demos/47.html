<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Portfolio and case-study layouts</title>
<style>
body{padding:0}.w{max-width:960px;margin:auto;padding:48px 24px;min-height:100svh;display:grid;align-content:center}
ul{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
li a{display:grid;grid-template-columns:50px 1fr auto;gap:16px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .4s cubic-bezier(.2,.8,.2,1),color .2s}
li a span:first-child,li a span:last-child{font:500 .72rem var(--mono);text-transform:uppercase;opacity:.55}
li a b{font:300 clamp(2rem,7vw,4.4rem)/1 var(--serif);letter-spacing:-.03em}
ul:hover li a{opacity:.35}ul li a:hover,ul li a:focus-visible{opacity:1;padding-left:20px;color:var(--accent)}
.pv{position:fixed;left:0;top:0;width:260px;height:180px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);z-index:5;display:none}
.pv.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:hover) and (pointer:fine){.pv{display:block}}
.th{display:none;height:90px;margin-top:8px;grid-column:2/-1}
@media (hover:none){li a{grid-template-columns:40px 1fr;}li a span:last-child{display:none}.th{display:block}}
</style>
<div class="w"><ul id="l"></ul></div><div class="pv" id="pv" aria-hidden="true"></div>
<script>
const P=[['Harbor','Brand · 2026',12],['Fieldwork','Web · 2025',200],['Nocturne','Motion · 2025',280],['Atlas','Product · 2024',140]];
l.innerHTML=P.map((p,i)=>`<li><a href="#" data-i="${i}"><span>0${i+1}</span><b>${p[0]}</b><span>${p[1]}</span><div class="th" style="background:linear-gradient(135deg,hsl(${p[2]} 75% 50%),hsl(${p[2]+40} 60% 80%))"></div></a></li>`).join('');
const bg=i=>`linear-gradient(135deg,hsl(${P[i][2]} 75% 50%),hsl(${P[i][2]+40} 60% 80%))`;
l.addEventListener('pointerover',e=>{const a=e.target.closest('a');if(a){pv.style.background=bg(a.dataset.i);pv.classList.add('on')}});
l.addEventListener('pointerleave',()=>pv.classList.remove('on'));
l.addEventListener('focusin',e=>{const a=e.target.closest('a');if(a){pv.style.background=bg(a.dataset.i);pv.style.left='70%';pv.style.top='50%';pv.classList.add('on')}});l.addEventListener('focusout',()=>pv.classList.remove('on'));
let x=0,y=0,cx=0,cy=0;addEventListener('pointermove',e=>{x=e.clientX;y=e.clientY});(function t(){cx+=(x-cx)*.15;cy+=(y-cy)*.15;if(!document.activeElement||document.activeElement.tagName!=='A'){pv.style.left=cx+'px';pv.style.top=cy+'px'}requestAnimationFrame(t)})();
</script>
