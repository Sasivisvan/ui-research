<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Footers</title>
<style>
body{padding:0}
.page{min-height:90svh;display:grid;place-items:center;text-align:center;padding:24px;font:300 clamp(1.6rem,5vw,3rem) var(--serif);background:var(--paper);position:relative;z-index:1}
.page small{display:block;font:500 .72rem var(--mono);text-transform:uppercase;opacity:.55;margin-top:10px}
footer{position:sticky;bottom:0;z-index:0;background:var(--ink);color:var(--paper);min-height:min(100svh,520px);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.mail{all:unset;cursor:pointer;font:300 clamp(2.4rem,11vw,8rem)/.9 var(--serif);letter-spacing:-.04em;word-break:break-word;transition:color .2s}
.mail:hover,.mail:focus-visible{color:var(--accent);outline:0}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:28px;padding-top:14px;border-top:1px solid rgba(242,238,228,.25);font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.04em}
.row a{color:inherit}
</style>
<div class="page"><div>Scroll to the end<small>the footer is sticky behind the page and gets uncovered</small></div></div>
<footer><button class="mail" id="m" aria-label="Copy email address">hello@atelier.studio</button>
<div class="row"><span>Lisbon · <time id="tm"></time> · Open for Jan 2027</span><span><a href="#">Instagram</a> · <a href="#">Read.cv</a> · <a href="#">© 2026</a></span></div></footer>
<script>
const tm=document.getElementById('tm');const tick=()=>tm.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,15000);
const m=document.getElementById('m');m.onclick=async()=>{try{await navigator.clipboard.writeText('hello@atelier.studio')}catch{}m.textContent='copied ✓';setTimeout(()=>m.textContent='hello@atelier.studio',1400)};
</script>
