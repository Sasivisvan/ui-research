<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Skeleton screens and shimmer</title>
<style>
.c{width:min(380px,100%);margin:auto;gap:14px;justify-items:stretch}
.card{border:1.5px solid var(--ink);padding:16px;display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center}
.sk{background:var(--p2);position:relative;overflow:hidden;border-radius:2px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-attachment:fixed;transform:translateX(-100%);animation:s 1.4s infinite}
@keyframes s{to{transform:translateX(100%)}}
.av{width:48px;height:48px;border-radius:50%;flex:none}.ln{height:12px}.img{height:140px}
.av2{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.im2{height:140px;background:linear-gradient(135deg,var(--accent),#ffb199 55%,var(--p2))}
.real{animation:in .5s}@keyframes in{from{opacity:0}}
h3{margin:0;font:300 1.4rem var(--serif)}p{margin:0;font-size:.9rem;opacity:.7}
.b{min-height:44px;border:1.5px solid var(--ink);background:none;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
</style>
<div class="c"><article class="card" id="cd" aria-busy="true" aria-live="polite"></article><button class="b" id="r">Reload</button></div>
<script>
const skel=`<div class="row"><div class="sk av"></div><div style="flex:1;display:grid;gap:8px"><div class="sk ln" style="width:60%"></div><div class="sk ln" style="width:35%"></div></div></div><div class="sk img"></div><div class="sk ln"></div><div class="sk ln" style="width:80%"></div>`;
const real=`<div class="real" style="display:grid;gap:12px"><div class="row"><div class="av2">MR</div><div><h3>Maya Rao</h3><p>2 hours ago</p></div></div><div class="im2"></div><p style="opacity:1">Layout-matching skeletons stop the page jumping when content arrives.</p></div>`;
function load(){cd.setAttribute('aria-busy','true');cd.innerHTML=skel;setTimeout(()=>{cd.innerHTML=real;cd.setAttribute('aria-busy','false')},2200)}
r.onclick=load;load();
</script>
