<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>CTA sections and newsletter signups</title>
<style>
body{padding:0}
.cta{min-height:100svh;background:var(--ink);color:var(--paper);display:grid;align-content:center;padding:clamp(24px,6vw,72px);gap:28px}
.cta h2{margin:0;font:300 clamp(3rem,13vw,11rem)/.88 var(--serif);letter-spacing:-.045em}.cta h2 em{color:var(--accent)}
.cta p{margin:0;max-width:40ch;opacity:.75;font:1.15rem/1.4 var(--serif)}
form{display:flex;gap:0;max-width:520px;border:1.5px solid var(--paper);transition:box-shadow .3s}
form:focus-within{box-shadow:6px 6px 0 var(--accent)}
input{flex:1;min-width:0;background:none;border:0;color:inherit;padding:0 16px;min-height:56px;outline:0;font-size:1rem}input::placeholder{color:rgba(242,238,228,.5)}
button{border:0;background:var(--accent);color:#fff;font-weight:700;padding:0 24px;min-height:56px;cursor:pointer;transition:filter .2s,transform .1s}button:hover{filter:brightness(1.1)}button:active{transform:scale(.97)}
.ok{display:none;font:300 1.8rem var(--serif)}.sent form{display:none}.sent .ok{display:block}
small{opacity:.55;font:500 .72rem var(--mono);text-transform:uppercase}
</style>
<section class="cta" id="c"><h2>Let’s make <em>something</em> good.</h2><p>One email a month. What we’re building, what we’re reading. Unsubscribe in one click.</p>
<form id="f" novalidate><label class="sr" for="e" style="position:absolute;left:-9999px">Email</label><input id="e" type="email" required placeholder="you@studio.com" autocomplete="email" inputmode="email"><button>Subscribe →</button></form>
<div class="ok" role="status">You’re in. Check your inbox to confirm.</div><small id="er" role="alert"></small></section>
<script>
f.onsubmit=e=>{e.preventDefault();if(!e.target.e.checkValidity()){er.textContent='That email doesn’t look right.';e.target.e.focus();return}er.textContent='';c.classList.add('sent')};
</script>
