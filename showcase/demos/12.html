<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Links and text-link styles</title>
<style>
.c{gap:34px;font:300 clamp(1.5rem,5vw,2.4rem)/1.2 var(--serif);justify-items:start;max-width:560px;margin:auto}
a{color:inherit;text-decoration:none}
.u{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s cubic-bezier(.2,.8,.2,1)}
.u:hover,.u:focus-visible{background-size:100% 1px}
.sw{display:inline-block;overflow:hidden;height:1.2em;vertical-align:bottom}
.sw span{display:block;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sw:hover span,.sw:focus-visible span{transform:translateY(-100%)}
.ar::after{content:"→";display:inline-block;margin-left:.3em;transition:transform .35s cubic-bezier(.3,.7,.4,1.5)}
.ar:hover::after{transform:translateX(.35em)}
.mk{background:linear-gradient(var(--accent),var(--accent)) 0 85%/100% .35em no-repeat;transition:background-size .3s,color .3s}
.mk:hover{background-size:100% 100%;color:#fff}
.ext::after{content:"↗";font-size:.6em;vertical-align:super;margin-left:.15em}
.row{font:500 .72rem var(--mono);text-transform:uppercase;opacity:.5;display:block;margin-bottom:6px}
</style>
<div class="c">
<div><span class="row">underline draws in</span><a class="u" href="#">Read the case study</a></div>
<div><span class="row">swap text</span><a class="sw" href="#"><span>Start a project<br>Let’s talk →</span></a></div>
<div><span class="row">arrow nudge</span><a class="ar u" href="#">See all work</a></div>
<div><span class="row">highlighter</span><a class="mk" href="#">Marked in orange</a></div>
<div><span class="row">external</span><a class="u ext" href="#">Documentation</a></div>
</div>
