<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Testimonials and social proof</title>
<style>
.c{width:min(880px,100%);margin:auto;gap:36px;align-content:center}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
figure{margin:0;border:1.5px solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:18px;justify-content:space-between}
blockquote{margin:0;font:300 1.3rem/1.3 var(--serif)}blockquote b{background:linear-gradient(var(--accent),var(--accent)) 0 90%/100% .3em no-repeat;font-weight:400;color:inherit}
figcaption{display:flex;align-items:center;gap:12px;font-size:.85rem}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
figcaption span{opacity:.6;display:block}
.m{font:300 3rem/1 var(--serif);color:var(--accent)}
.logos{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;opacity:.6;filter:grayscale(1);font:italic 1.4rem var(--serif);transition:opacity .3s}
.logos:hover{opacity:1}.logos span:nth-child(even){font:600 1.1rem system-ui;letter-spacing:.2em;text-transform:uppercase}
</style>
