<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Contact sections and forms</title>
<style>
.c{width:min(680px,100%);margin:auto;gap:22px;justify-items:start;align-content:center}
.mail{all:unset;cursor:pointer;font:300 clamp(2rem,9vw,4.6rem)/1 var(--serif);letter-spacing:-.035em;border-bottom:3px solid var(--accent);padding-bottom:4px;transition:color .2s}.mail:hover,.mail:focus-visible{color:var(--accent)}
.meta{font:500 .72rem var(--mono);text-transform:uppercase;opacity:.65;display:flex;gap:18px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}.ch{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:99px;background:none;cursor:pointer;font-weight:600;transition:.2s}.ch[aria-pressed=true]{background:var(--ink);color:var(--paper)}
form{display:grid;gap:12px;width:100%}
textarea,input{width:100%;padding:12px 14px;border:1.5px solid var(--ink);background:#fff8;border-radius:2px;min-height:48px}textarea{min-height:96px;field-sizing:content;resize:none}
textarea:focus,input:focus{outline:0;box-shadow:4px 4px 0 var(--ink)}
.go{min-height:52px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;justify-self:start;padding:0 28px}
.l{font:500 .68rem var(--mono);text-transform:uppercase;opacity:.6;margin:0}
</style>
<div class="c"><button class="mail" id="m" aria-label="Copy email address">hello@atelier.studio</button>
<p class="meta"><span>Lisbon · <time id="t"></time></span><span>Replies in ~1 day</span></p>
<p class="l">What do you need?</p><div class="chips" id="ch" role="group" aria-label="Project type"><button class="ch" aria-pressed="true">Website</button><button class="ch" aria-pressed="false">Brand</button><button class="ch" aria-pressed="false">Motion</button></div>
<form onsubmit="event.preventDefault();this.innerHTML='<p style=&quot;font:300 1.8rem Georgia&quot;>Thanks — we’ll write back soon.</p>'"><label class="l" for="nm">Name</label><input id="nm" required autocomplete="name"><label class="l" for="ms">Brief</label><textarea id="ms" placeholder="Two lines is enough."></textarea><button class="go">Send brief →</button></form></div>
<script>
const tick=()=>t.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,15000);
m.onclick=async()=>{try{await navigator.clipboard.writeText('hello@atelier.studio')}catch{}m.textContent='copied ✓';setTimeout(()=>m.textContent='hello@atelier.studio',1400)};
ch.onclick=e=>{const b=e.target.closest('.ch');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
</script>
