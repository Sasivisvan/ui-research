<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><title>Loaders and spinners</title>
<style>
.c{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:36px 20px;max-width:640px;margin:auto;justify-items:center;text-align:center}
.c small{display:block;margin-top:16px;font:500 .68rem var(--mono);text-transform:uppercase;opacity:.55}
.sp{width:44px;height:44px;border:3px solid var(--p2);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
.dt{display:flex;gap:6px;height:44px;align-items:center}.dt i{width:10px;height:10px;background:var(--ink);border-radius:50%;animation:b 1s ease-in-out infinite}.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-12px);background:var(--accent)}}
.bar{width:100px;height:4px;background:var(--p2);overflow:hidden;margin-top:20px}.bar::after{content:"";display:block;width:40%;height:100%;background:var(--accent);animation:s 1.1s ease-in-out infinite}@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.sq{width:36px;height:36px;margin-top:4px;background:var(--ink);animation:q 1.4s cubic-bezier(.7,0,.3,1) infinite}@keyframes q{50%{transform:rotate(180deg) scale(.5);background:var(--accent);border-radius:50%}to{transform:rotate(360deg)}}
.bars{display:flex;gap:4px;align-items:end;height:44px}.bars i{width:6px;height:100%;background:var(--ink);animation:h 1s ease-in-out infinite;transform-origin:bottom}.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.2s}.bars i:nth-child(4){animation-delay:.3s}@keyframes h{50%{transform:scaleY(.3)}}
.dl{width:100%}.b2{min-height:48px;padding:0 20px;border:1.5px solid var(--ink);background:none;font-weight:600;cursor:pointer}
.lz{min-height:44px;display:grid;place-items:center}.lz .sp{opacity:0;animation:r .8s linear infinite,show .2s .4s forwards}@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sp,.dt i,.sq,.bars i{animation:none}.bar::after{animation:none;width:100%}}
</style>
<div class="c"><div><div class="sp" role="status" aria-label="Loading"></div><small>Ring</small></div><div><div class="dt" role="status" aria-label="Loading"><i></i><i></i><i></i></div><small>Dots</small></div><div><div class="bar" role="status" aria-label="Loading"></div><small>Indeterminate</small></div><div><div class="sq" role="status" aria-label="Loading"></div><small>Morph</small></div><div><div class="bars" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></div><small>Equaliser</small></div>
<div class="dl"><div class="lz" id="lz"></div><button class="b2" id="go">Delay 400ms</button><small>Only shows if slow</small></div></div>
<script>go.onclick=()=>{lz.innerHTML='<div class="sp" role="status" aria-label="Loading"></div>';setTimeout(()=>lz.innerHTML='',1600)}</script>
