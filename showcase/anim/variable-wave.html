<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"text","title":"Variable-font weight wave","desc":"Each letter’s weight follows a sine wave across the word. One variable font file, no extra weights to load.","note":"Needs a variable font with a wght axis (Bricolage Grotesque, Recursive, Fraunces). Respect reduced motion."} -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&display=swap">
<style>h1{margin:0;font:400 clamp(2.6rem,12vw,7rem)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.04em;font-variation-settings:"wght" 400;text-align:center}h1 span{display:inline-block;font-variation-settings:"wght" var(--w,400)}</style>
<div class="c"><h1 id="h" aria-label="Weight in motion">Weight in motion</h1></div>
<script>
const t=h.getAttribute('aria-label');h.innerHTML=[...t].map(c=>c===' '?' ':`<span aria-hidden="true">${c}</span>`).join('');const sp=[...h.querySelectorAll('span')];
let k=0;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;(function f(){k+=.04;sp.forEach((s,i)=>s.style.setProperty('--w',Math.round(500+300*Math.sin(k+i*.5))));if(!reduce)requestAnimationFrame(f)})();
</script>
