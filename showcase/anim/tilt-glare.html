<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"hover","title":"Tilt with glare","desc":"Card tilts toward the pointer in 3D and a soft highlight follows it. Eases back on leave.","note":"Fine pointers only. Cap rotation ~10–14°. Add will-change: transform sparingly."} -->
<style>
.c{perspective:900px}
.t{--rx:0deg;--ry:0deg;--gx:50%;--gy:50%;width:min(320px,86vw);aspect-ratio:3/4;background:linear-gradient(150deg,var(--accent),#7a1d05);color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:20px 24px 0 rgba(0,0,0,.18)}
.t.m{transition:none}
.t::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.45),transparent 55%);pointer-events:none}
.t b{font:300 2.4rem/1 var(--serif);position:relative;z-index:1}.t small{font:500 .7rem var(--mono);text-transform:uppercase;position:relative;z-index:1}
</style>
<div class="c"><div class="t" id="t"><small>Nº 07</small><b>Tilt &amp; glare</b></div></div>
<script>
if(matchMedia('(hover:hover) and (pointer:fine)').matches){t.onpointermove=e=>{const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;t.classList.add('m');t.style.setProperty('--ry',(x-.5)*20+'deg');t.style.setProperty('--rx',(.5-y)*20+'deg');t.style.setProperty('--gx',x*100+'%');t.style.setProperty('--gy',y*100+'%')};t.onpointerleave=()=>{t.classList.remove('m');t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg')}}
</script>
