<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"ease","title":"Easing lab","desc":"Race five curves over the same distance and see why ease-out feels responsive and linear feels dead.","note":"UI enter/exit: ease-out, 150–300ms. Never use linear for movement. Overshoot only for playful moments."} -->
<style>
.c{width:min(560px,100%);margin:auto;gap:10px;justify-items:stretch;align-content:center}
.r{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;font:500 .72rem var(--mono);text-transform:uppercase}
.t{height:36px;border-bottom:1.5px solid var(--line);position:relative}
.d{position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);transition:transform 1.2s var(--e)}
.go .d{transform:translateX(calc(min(560px,100vw - 48px) - 96px - 12px - 24px))}
.b{min-height:48px;border:1.5px solid var(--ink);background:none;font-weight:600;cursor:pointer;margin-top:8px}
</style>
<div class="c" id="c"></div><script>
const E=[['linear','linear'],['ease-in','ease-in'],['ease-out','cubic-bezier(.2,.8,.2,1)'],['expo-out','cubic-bezier(.16,1,.3,1)'],['overshoot','cubic-bezier(.3,.7,.4,1.5)'],['spring','linear(0,.55 9%,1.08 20%,.98 33%,1.01 45%,1 60%,1)']];
c.innerHTML=E.map(([n,e])=>`<div class="r"><span>${n}</span><div class="t"><i class="d" style="--e:${e}"></i></div></div>`).join('')+'<button class="b" id="g">Race ▶</button>';
g.onclick=()=>{c.classList.remove('go');c.offsetWidth;c.classList.add('go')};
</script>
