<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"bg","title":"Mesh gradient + grain","desc":"Layered radial gradients that drift, finished with an SVG noise overlay so it feels printed, not plastic.","note":"Use a tiny inline SVG feTurbulence for grain; mix-blend-mode overlay. Pause animation when off-screen."} -->
<style>
body{padding:0;overflow:hidden}.bg{position:fixed;inset:0;background:#ff4a1c;background-image:radial-gradient(40% 50% at 20% 25%,#ffcf5a,transparent 70%),radial-gradient(45% 55% at 80% 30%,#7a1d05,transparent 70%),radial-gradient(50% 60% at 55% 85%,#5ac8ff,transparent 70%);background-size:140% 140%;animation:d 14s ease-in-out infinite alternate}
@keyframes d{to{background-position:100% 100%;filter:hue-rotate(25deg)}}
.n{position:fixed;inset:0;opacity:.32;mix-blend-mode:overlay;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1{position:relative;margin:0;min-height:100svh;display:grid;place-items:center;color:#fff;font:300 clamp(3rem,13vw,10rem)/.9 var(--serif);letter-spacing:-.04em;text-align:center}
</style>
<div class="bg"></div><div class="n"></div><h1>Grain<br><i>&amp; glow</i></h1>
