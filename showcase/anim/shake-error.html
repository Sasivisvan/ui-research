<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"micro","title":"Error shake","desc":"Invalid field shakes once, turns red and announces the error. 8px, 400ms — enough to notice, not enough to annoy.","note":"Pair with a text error message and aria-describedby; never rely on shake alone. Disable under reduced motion."} -->
<style>
.c{width:min(340px,100%);margin:auto;justify-items:stretch}
input{min-height:52px;padding:0 14px;border:1.5px solid var(--ink);background:#fff8;font-size:1rem}input:focus{outline:0;box-shadow:4px 4px 0 var(--ink)}
.bad{border-color:#c0261b;animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.e{color:#c0261b;font-size:.85rem;min-height:1.3em}
button{min-height:48px;border:0;background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bad{animation:none}}
</style>
<form class="c" id="f" novalidate><label for="i" style="font-weight:600;font-size:.88rem">Promo code</label><input id="i" aria-describedby="e" autocomplete="off" placeholder="Try anything but SPRING"><div class="e" id="e" role="alert"></div><button>Apply</button></form>
<script>f.onsubmit=e=>{e.preventDefault();const ok=i.value.trim().toUpperCase()==='SPRING';i.classList.remove('bad');i.offsetWidth;if(!ok){i.classList.add('bad');i.setAttribute('aria-invalid','true');e.textContent=''; document.getElementById('e').textContent='That code isn’t valid.'}else{i.removeAttribute('aria-invalid');document.getElementById('e').textContent='';document.getElementById('e').style.color='#1d8a4a';document.getElementById('e').textContent='Applied ✓'}}</script>
