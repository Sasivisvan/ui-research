<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"micro","title":"Like burst","desc":"Heart pops with overshoot and sheds particles. State is a real toggle button with aria-pressed.","note":"Particles are decorative (aria-hidden) and removed after the animation."} -->
<style>
.l{position:relative;width:72px;height:72px;border:1.5px solid var(--ink);border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center}
.l svg{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:2;transition:fill .2s,stroke .2s}
.l[aria-pressed=true] svg{fill:var(--accent);stroke:var(--accent);animation:pop .5s cubic-bezier(.3,.7,.4,1.8)}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.p{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--accent);pointer-events:none;animation:fly .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
</style>
<div class="c"><button class="l" id="l" aria-pressed="false" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg></button></div>
<script>
l.onclick=()=>{const on=l.getAttribute('aria-pressed')!=='true';l.setAttribute('aria-pressed',on);if(!on)return;for(let i=0;i<10;i++){const p=document.createElement('i');p.className='p';const a=i/10*6.283;p.style.setProperty('--x',Math.cos(a)*44+'px');p.style.setProperty('--y',Math.sin(a)*44+'px');l.append(p);setTimeout(()=>p.remove(),600)}};
</script>
