<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"text","title":"Word mask reveal","desc":"Headline words rise out of a clipping mask with a stagger. Original text stays in aria-label so the split doesn’t break reading.","note":"Split in JS (or SplitText), keep aria-label on the parent, and replay only once per view."} -->
<style>
.c{gap:20px}h1{margin:0;font:300 clamp(2.4rem,9vw,5.5rem)/1 var(--serif);letter-spacing:-.035em;text-align:center;max-width:12ch}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em}.w span{display:inline-block;transform:translateY(110%) rotate(4deg);animation:u .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*80ms)}
@keyframes u{to{transform:none}}.b{min-height:44px;border:1.5px solid var(--ink);background:none;padding:0 20px;font-weight:600;cursor:pointer}
</style>
<div class="c"><h1 id="h" aria-label="Type that moves with intent">Type that moves with intent</h1><button class="b" id="r">Replay</button></div>
<script>const t=h.getAttribute('aria-label');const d=()=>h.innerHTML=t.split(' ').map((w,i)=>`<span class="w" aria-hidden="true"><span style="--i:${i}">${w}</span></span>`).join(' ');d();r.onclick=d</script>
