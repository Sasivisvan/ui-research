<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"bg","title":"Halftone canvas","desc":"Canvas dot grid whose dot radius follows a moving wave field — a halftone / dither look in 20 lines, 60fps.","note":"Draw at devicePixelRatio, pause when hidden, cap dot count on mobile."} -->
<style>body{padding:0;background:#f2eee4;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}h1{position:relative;margin:0;min-height:100svh;display:grid;place-items:center;font:300 clamp(3rem,13vw,10rem)/.9 var(--serif);letter-spacing:-.04em;mix-blend-mode:difference;color:#fff;text-align:center;pointer-events:none}</style>
<canvas id="c" aria-hidden="true"></canvas><h1>Halftone</h1>
<script>
const x=c.getContext('2d');let W,H,t=0,mx=.5,my=.5;const dpr=Math.min(2,devicePixelRatio);const rs=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr};rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function f(){t+=.02;x.clearRect(0,0,W,H);x.fillStyle='#15130e';const s=Math.max(22*dpr,W/60);for(let j=0;j<H/s+1;j++)for(let i=0;i<W/s+1;i++){const px=i*s,py=j*s,d=Math.hypot(px/W-mx,py/H-my),v=(Math.sin(i*.35+t)+Math.cos(j*.3-t)+1.6-d*2.2)/4;const r=Math.max(0,Math.min(1,v))*s*.5;x.beginPath();x.arc(px,py,r,0,7);x.fill()}if(!reduce)requestAnimationFrame(f)}f();
</script>
