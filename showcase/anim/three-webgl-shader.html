<style>
:root{--ink:#15130e;--paper:#f2eee4;--p2:#e6e0d0;--accent:#ff4a1c;--line:rgba(21,19,14,.22);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.c{min-height:calc(100svh - 48px);display:grid;place-items:center;align-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><!--meta {"cat":"three","title":"WebGL fragment shader","desc":"A full-screen fragment shader in ~25 lines of raw WebGL — no library. Pointer bends the field. The basis of Paper Shaders–style backgrounds.","note":"Fall back to a CSS gradient when WebGL is unavailable. Cap DPR at 1.5–2 and pause when hidden."} -->
<style>body{padding:0;background:#15130e;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;background:linear-gradient(135deg,#ff4a1c,#15130e)}h1{position:relative;margin:0;min-height:100svh;display:grid;place-items:center;color:#f2eee4;font:300 clamp(3rem,13vw,10rem)/.9 var(--serif);letter-spacing:-.04em;mix-blend-mode:difference;pointer-events:none}</style>
<canvas id="c" aria-hidden="true"></canvas><h1>Shader</h1>
<script>
const gl=c.getContext('webgl');if(gl){
 const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1)}';
 const fs='precision mediump float;uniform vec2 r;uniform float t;uniform vec2 m;void main(){vec2 u=gl_FragCoord.xy/r;vec2 q=(u-.5)*vec2(r.x/r.y,1)*3.;q+=(m-.5)*1.5;float v=0.;for(int i=1;i<5;i++){float f=float(i);q+=vec2(sin(q.y*f+t*.6),cos(q.x*f-t*.5))/f;v+=sin(q.x+q.y)/f}vec3 col=.5+.5*cos(6.28*(v*.25+vec3(0.,.12,.25))+t*.2);col=mix(vec3(.08,.07,.05),col*vec3(1.,.35,.15)+vec3(.0,.05,.1),smoothstep(-.8,.9,v));gl_FragColor=vec4(col,1.)}';
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
 const U=n=>gl.getUniformLocation(pr,n);let mx=.5,my=.5,t=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight});
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,dpr=Math.min(1.5,devicePixelRatio);
 (function f(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;gl.viewport(0,0,c.width,c.height);t+=.016;gl.uniform2f(U('r'),c.width,c.height);gl.uniform1f(U('t'),t);gl.uniform2f(U('m'),mx,my);gl.drawArrays(gl.TRIANGLES,0,3);if(!reduce)requestAnimationFrame(f)})();
}
</script>
